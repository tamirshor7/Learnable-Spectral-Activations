# Functional testing only. GPU numerical references are not expected on CPU.
name: lsa-unified-cpu
channels:
  - conda-forge
dependencies:
  - python=3.10.19
  - pip=25.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.10.0+cpu
      - -r environments/requirements-cpu.lock.txt
